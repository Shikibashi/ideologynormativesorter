<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Political Judgment Decomposition</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('political-judgment-appearance-v1')
            || localStorage.getItem('political-judgment-theme-v1')
          const appearance = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          const systemDark = typeof window.matchMedia !== 'function'
            || window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = appearance === 'system' ? (systemDark ? 'dark' : 'light') : appearance
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
