name: Repair PR18

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/commitment-based-ideology-scoring

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/commitment-based-ideology-scoring
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repair
        shell: python
        run: |
          from pathlib import Path
          print("repair workflow armed")
      - name: Commit verified repair
        shell: bash
        env:
          HEAD_BRANCH: refactor/commitment-based-ideology-scoring
        run: |
          set -euo pipefail
          echo "workflow trigger check"
