name: Repair PR18

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose record-specific worker validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('research-worker/src/worker.mjs')
          text = p.read_text()

          core_anchor = '''   const validMatrixForm =\n      Number.isInteger(requestedCount) &&\n      requestedCount === assignedCount &&\n      allowedMatrixCounts.has(requestedCount);\n   return ('''
          core_new = '''   const validMatrixForm =\n      Number.isInteger(requestedCount) &&\n      requestedCount === assignedCount &&\n      allowedMatrixCounts.has(requestedCount);\n   console.error("CORE_DETAIL", JSON.stringify({\n      tier: submission.tier, assignedCount, requestedCount, expectedProfileCount, validProfileForm, validMatrixForm,\n      answered: validAnsweredRecord(submission), canonicalItemMap: validCanonicalItemMap(submission),\n      bank: validVersion(submission.bankVersion, env.EXPECTED_BANK_VERSION),\n      scoring: validVersion(submission.scoringVersion, env.EXPECTED_SCORING_VERSION),\n      taxonomy: validVersion(submission.taxonomyVersion, env.EXPECTED_TAXONOMY_VERSION),\n      primaryMeasurement: validVersion(submission.primaryMeasurementVersion, env.EXPECTED_PRIMARY_MEASUREMENT_VERSION),\n      modifierMeasurement: validVersion(submission.modifierMeasurementVersion, env.EXPECTED_MODIFIER_MEASUREMENT_VERSION),\n      primaryFingerprint: validVersion(submission.primaryLabelRosterFingerprint, env.EXPECTED_PRIMARY_LABEL_ROSTER_FINGERPRINT),\n      modifierFingerprint: validVersion(submission.modifierLabelRosterFingerprint, env.EXPECTED_MODIFIER_LABEL_ROSTER_FINGERPRINT),\n      identity: validIdentity(submission.identity),\n      formAlgorithm: submission.form?.algorithmVersion === env.EXPECTED_FORM_VERSION,\n      assignedMatch: submission.form?.assignedItemCount === assignedCount,\n      formFingerprint: submission.form?.fingerprint === researchFormFingerprint(submission.itemMap, env.EXPECTED_FORM_VERSION),\n      sampling: submission.sampling?.design === "open-opt-in-nonprobability" && submission.sampling?.populationInference === false && submission.sampling?.weighting === "none",\n      assignment: submission.specialistAssignment === undefined || validAssignment(submission.specialistAssignment, submission.specialistAssignment.moduleId, submission.participantId, submission.studyId, env)\n   }));\n   return ('''
          if core_anchor not in text:
              raise SystemExit('core anchor not found')
          text = text.replace(core_anchor, core_new, 1)

          specialist_anchor = '''function validSpecialistRecord(submission, env) {\n   const module = resolvedCanonicalSpecialistModule(submission.moduleId);\n   const observedEvidence = submission.observations?.evidence?.value;\n   return ('''
          specialist_new = '''function validSpecialistRecord(submission, env) {\n   const module = resolvedCanonicalSpecialistModule(submission.moduleId);\n   const observedEvidence = submission.observations?.evidence?.value;\n   console.error("SPECIALIST_DETAIL", JSON.stringify({\n      moduleResolved: module !== undefined,\n      answered: validAnsweredRecord(submission),\n      itemMap: module !== undefined && validSpecialistItemMap(submission, module),\n      moduleVersion: module !== undefined && submission.moduleVersion === module.version,\n      evidence: module !== undefined && validSpecialistEvidence(submission.evidence, module.itemIds.length),\n      observedEvidence: module !== undefined && validSpecialistEvidence(observedEvidence, module.itemIds.length),\n      bank: validVersion(submission.bankVersion, env.EXPECTED_BANK_VERSION),\n      scoring: validVersion(submission.scoringVersion, env.EXPECTED_SCORING_VERSION),\n      assignment: validAssignment(submission.assignment, submission.moduleId, submission.participantId, submission.studyId, env),\n      criterion: isObject(submission.criterion) && Array.isArray(submission.criterion.selectedIds),\n      scores: isObject(submission.constructScores) && Object.values(submission.constructScores).every((score) => Number.isFinite(score)),\n      matches: Array.isArray(submission.matches) && submission.matches.every((match) => isObject(match) && validToken(match.id) && Number.isFinite(match.fit))\n   }));\n   return ('''
          if specialist_anchor not in text:
              raise SystemExit('specialist anchor not found')
          text = text.replace(specialist_anchor, specialist_new, 1)

          old_validate = '''export function validateSubmission(submission, env) {\n   if (!contractMetadataMatches(submission, env)) return false;\n   if (!validBaseRecord(submission, env)) return false;\n   if (submission.recordType === "core") return validCoreRecord(submission, env);\n   if (submission.recordType === "specialist")\n      return validSpecialistRecord(submission, env);\n   if (submission.recordType === "specialist-disposition")\n      return validSpecialistDisposition(submission, env);\n   return false;\n}'''
          new_validate = '''export function validateSubmission(submission, env) {\n   const contract = contractMetadataMatches(submission, env);\n   const base = validBaseRecord(submission, env);\n   const specific = submission.recordType === "core"\n      ? validCoreRecord(submission, env)\n      : submission.recordType === "specialist"\n         ? validSpecialistRecord(submission, env)\n         : submission.recordType === "specialist-disposition"\n            ? validSpecialistDisposition(submission, env)\n            : false;\n   console.error("WORKER_VALIDATION_DEBUG", JSON.stringify({ recordType: submission.recordType, contract, base, specific }));\n   return contract && base && specific;\n}'''
          if old_validate not in text:
              raise SystemExit('validate block not found')
          p.write_text(text.replace(old_validate, new_validate, 1))
      - run: npx vitest run src/research/workerCompatibility.test.ts
