name: Repair PR18

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose legacy worker validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('research-worker/src/worker.mjs')
          text = p.read_text()
          old = '''export function validateSubmission(submission, env) {\n   if (!contractMetadataMatches(submission, env)) return false;\n   if (!validBaseRecord(submission, env)) return false;\n   if (submission.recordType === "core") return validCoreRecord(submission, env);\n   if (submission.recordType === "specialist")\n      return validSpecialistRecord(submission, env);\n   if (submission.recordType === "specialist-disposition")\n      return validSpecialistDisposition(submission, env);\n   return false;\n}'''
          new = '''export function validateSubmission(submission, env) {\n   const contract = contractMetadataMatches(submission, env);\n   const base = validBaseRecord(submission, env);\n   const specific = submission.recordType === "core"\n      ? validCoreRecord(submission, env)\n      : submission.recordType === "specialist"\n         ? validSpecialistRecord(submission, env)\n         : submission.recordType === "specialist-disposition"\n            ? validSpecialistDisposition(submission, env)\n            : false;\n   console.error("WORKER_VALIDATION_DEBUG", JSON.stringify({ recordType: submission.recordType, contract, base, specific }));\n   return contract && base && specific;\n}'''
          if old not in text:
              raise SystemExit('validateSubmission block not found')
          p.write_text(text.replace(old, new, 1))
      - run: npx vitest run src/research/workerCompatibility.test.ts
