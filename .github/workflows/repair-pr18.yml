name: Repair PR18

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose first canonical item mismatch
        shell: python
        run: |
          from pathlib import Path
          p = Path('research-worker/src/worker.mjs')
          text = p.read_text()
          old = '''   return Object.entries(expected).every(\n      ([field, value]) =>\n         item[field] !== undefined &&\n         canonicalize(item[field]) === canonicalize(value),\n   );\n}\n\nfunction validCanonicalItemMap(submission) {'''
          new = '''   const mismatch = Object.entries(expected).find(\n      ([field, value]) =>\n         item[field] === undefined ||\n         canonicalize(item[field]) !== canonicalize(value),\n   );\n   if (mismatch) {\n      const [field, value] = mismatch;\n      console.error("ITEM_MISMATCH", JSON.stringify({\n         questionId: item.questionId, field, expected: value, actual: item[field],\n         canonicalRole: canonical.role, canonicalTier: canonical.tier, canonicalResponseType: canonical.responseType\n      }));\n      return false;\n   }\n   return true;\n}\n\nfunction validCanonicalItemMap(submission) {'''
          if old not in text:
              raise SystemExit('item matcher block not found')
          text = text.replace(old, new, 1)

          old2 = '''      const canonical = CANONICAL_ITEM_BY_ID.get(item.questionId);\n      if (!canonical || !canonicalItemContentMatches(item, canonical))\n         return false;\n      if (submission.recordType === "core") {\n         return (\n            canonical.role === "core" &&\n            ACTIVE_CORE_ITEM_IDS.has(canonical.id) &&\n            TIER_RANK[canonical.tier] <= maxTier\n         );\n      }'''
          new2 = '''      const canonical = CANONICAL_ITEM_BY_ID.get(item.questionId);\n      if (!canonical) {\n         console.error("ITEM_SCOPE_MISMATCH", JSON.stringify({ questionId: item.questionId, reason: "missing-canonical" }));\n         return false;\n      }\n      if (!canonicalItemContentMatches(item, canonical)) return false;\n      if (submission.recordType === "core") {\n         const scopeOk = canonical.role === "core" &&\n            ACTIVE_CORE_ITEM_IDS.has(canonical.id) &&\n            TIER_RANK[canonical.tier] <= maxTier;\n         if (!scopeOk) console.error("ITEM_SCOPE_MISMATCH", JSON.stringify({\n            questionId: item.questionId, role: canonical.role, tier: canonical.tier,\n            active: ACTIVE_CORE_ITEM_IDS.has(canonical.id), maxTier\n         }));\n         return scopeOk;\n      }'''
          if old2 not in text:
              raise SystemExit('item scope block not found')
          text = text.replace(old2, new2, 1)
          p.write_text(text)
      - run: npx vitest run src/research/workerCompatibility.test.ts --testNamePattern "complete moderate"
