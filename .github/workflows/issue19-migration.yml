name: Issue 19 specialist migration

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/specialist-commitment-scoring

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/specialist-commitment-scoring
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply specialist commitment migration
        run: python scripts/migrate-specialist-commitments.py
      - name: Compile canonical content
        run: npx --yes vite-node v2/tools/compile-content.ts
      - name: Run focused specialist and architecture tests
        run: npx vitest run tests/engine/v2-phase7-specialists.spec.ts tests/architecture/v2-phase2.spec.ts
      - name: Commit migrated source and generated bundle
        env:
          HEAD_BRANCH: refactor/specialist-commitment-scoring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: convert specialist scoring to commitments"
          git push origin "HEAD:${HEAD_BRANCH}"
