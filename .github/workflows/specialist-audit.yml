name: Specialist commitment audit

on:
  pull_request:
    paths:
      - "v2/content/constructs/specialist.json"
      - "v2/content/items/specialist.json"
      - "v2/content/profiles/specialists.json"
      - "scripts/audit-specialist-commitments.mjs"
      - ".github/workflows/specialist-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit specialist constructs and legacy profile uses
        run: node scripts/audit-specialist-commitments.mjs
