name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile canonical v2 content
        run: npm run v2:content:compile

      - name: Validate source-backed specialist content
        run: npm run v2:specialist:check

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check collector syntax
        run: node --check research-collector/server.mjs

      - name: Check research version contract
        run: npm run research:check
      - name: Check canonical imports
        run: npm run canonical:check

      - name: Test edge collector
        run: npm run test:worker

      - name: Build production bundle
        run: npm run build

  research-analysis-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R analysis dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            jsonlite
            psych
            lavaan
            mirt
            boot
      - name: Parse external validation pipelines
        run: |
          Rscript -e "parse(file='analysis/run_validation.R')"
          Rscript -e "parse(file='analysis/run_data_quality.R')"
          Rscript -e "parse(file='analysis/run_specialist_validation.R')"
      - name: Run R synthetic smoke pipeline
        run: bash scripts/run-r-smoke.sh artifacts/r-smoke

  browser-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Replay and diff reference lock
        run: |
          npm run reference-lock:replay
          npm run reference-lock:diff

      - name: Run browser flows
        run: npm run test:e2e

      - name: Run accessibility scans
        run: npm run test:a11y

      - name: Run ECW rendered checks
        run: npm run test:ecw

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-conformance-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
