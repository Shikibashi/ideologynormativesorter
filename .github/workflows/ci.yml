name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check collector syntax
        run: node --check research-collector/server.mjs

      - name: Build production bundle
        run: npm run build

  research-analysis-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Parse external validation pipeline
        run: |
          Rscript -e "parse(file='analysis/run_validation.R')"
          Rscript -e "parse(file='analysis/run_data_quality.R')"
          Rscript -e "parse(file='analysis/run_dif.R')"
          Rscript -e "parse(file='analysis/synthetic/generate_synthetic_study.R')"
          Rscript -e "parse(file='analysis/synthetic/check_synthetic_outputs.R')"
